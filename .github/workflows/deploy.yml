name: Auto Deploy to Ubuntu Server

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Deploy new code
        run: |
          # Navigate to the folder where your frontend is stored
          cd ~/dev/palm-web-admin
          
          # Pull the latest code you just pushed
          git pull origin main
          
          # Stop and remove the old container if it exists
          docker rm -f palm_web_admin || true
          
          # Build the new Docker image
          docker build -t palm-admin .
          
          # Run the new container
          docker run -d -p 3000:3000 --name palm_web_admin palm-admin
          
          # Clean up unused dangling docker images to save server space
          docker image prune -f
